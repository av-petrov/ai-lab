# Strictly read-only access for the capacity collector (get/list only, no watch/create/patch/delete).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-reader
  namespace: platform-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capacity-reader
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, resourcequotas, limitranges, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capacity-reader
subjects:
  - kind: ServiceAccount
    name: capacity-reader
    namespace: platform-tools
