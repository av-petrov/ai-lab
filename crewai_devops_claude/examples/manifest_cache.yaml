# Admission from a ready manifest: StatefulSet with per-replica gp3 volumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
spec:
  replicas: 3
  serviceName: cache
  selector:
    matchLabels: {app: cache}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: redis
          image: redis:7.4
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 1Gi}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: cache}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
