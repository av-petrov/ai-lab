# AdmissionSpec: resize shop/api 500m -> 700m CPU. Required anti-affinity one-per-node on 3 nodes
# with maxSurge 1 / maxUnavailable 0 -> the rollout deadlocks although the steady state fits.
name: api
namespace: shop
kind: Deployment
change_type: resize
replicas: 3
labels: {app: api}
containers:
  - name: main
    requests: {cpu: 700m, memory: 1Gi}
    limits: {memory: 1Gi}
strategy: {type: RollingUpdate, max_surge: 1, max_unavailable: 0}
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector: {matchLabels: {app: api}}
        topologyKey: kubernetes.io/hostname
