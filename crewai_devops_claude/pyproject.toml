[project]
name = "k8s_capacity"
version = "0.1.0"
description = "Read-only Kubernetes capacity audit and admission simulation with CrewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15,<2.0",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
k8s-capacity = "k8s_capacity.main:cli"
run_crew = "k8s_capacity.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_capacity"]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
