[project]
name = "k8s_capacity"
version = "0.2.0"
description = "CrewAI SRE agents: read-only Kubernetes capacity audit and Argo CD observability"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.15,<2.0",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
k8s-capacity = "k8s_capacity.main:cli"
run_crew = "k8s_capacity.main:run"
argocd-observe = "argocd_observability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_capacity", "src/argocd_observability", "src/sre_common"]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
