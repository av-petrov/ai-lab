apiVersion: v1
kind: ServiceAccount
metadata:
  name: crewai-reader
  namespace: crewai-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crewai-reader
  namespace: crewai-demo
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crewai-reader
  namespace: crewai-demo
subjects:
  - kind: ServiceAccount
    name: crewai-reader
    namespace: crewai-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crewai-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crewai-node-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crewai-node-reader
subjects:
  - kind: ServiceAccount
    name: crewai-reader
    namespace: crewai-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crewai-node-reader